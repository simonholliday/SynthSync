<text class="note" x="24" y="490" text-anchor="start">Fit any of them, or all. One transistor serves every socket, and each socket has its own two resistors.</text>
<text class="note" x="24" y="510" text-anchor="start">On a 5-pin DIN socket, go by the numbers moulded on it: they don&#x27;t run in order.</text>
