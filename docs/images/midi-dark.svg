<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 526" width="780" height="526" role="img" aria-labelledby="title about">
<title id="title">MIDI out, with a socket of each kind</title><desc id="about">The 3.3 volt pin feeds a 33 ohm resistor for each socket. GP11 goes through 1 kilohm to the base of an NPN transistor, with 4.7 kilohms from base to emitter and the emitter to ground. The collector feeds a 10 ohm resistor for each socket. On a Type A jack the 33 ohms goes to the ring and the 10 ohms to the tip. On a Type B jack they are the other way round. On a 5-pin DIN socket they go to pins 4 and 5. The sleeve, or pin 2, goes to ground.</desc>
