<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="title about">
<title id="title">A clock output with an LED</title><desc id="about">The same circuit as a clock output, with a 1 kilohm resistor and an LED from the PNP transistor&#x27;s collector to ground, which light with each pulse.</desc>
