<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1290" width="720" height="1290" role="img" aria-labelledby="title about">
<title id="title">An example: a main clock, two multividers and both buttons</title><desc id="about">A Pico 2 W with three clock outputs on GP2, GP3 and GP4, each as the clock output circuit, a play/pause button on GP21, a stop button on GP22, 5 volts taken from VSYS and ground from a GND pin.</desc>
